# Generate the OpenClaw model catalog ourselves and publish it with local supplements.
#
# We run OpenClaw's own generator (scripts/publish-model-catalog.mts) here instead of
# mirroring catalog.openclaw.ai, so an outage in OpenClaw's publish job no longer
# freezes this catalog. The openrouter provider comes from OpenRouter's public
# /api/v1/models list, fetched on every run.
#
# Triggers are limited to schedule + workflow_dispatch on purpose:
# pull_request_target is the one trigger that would hand a fork PR this
# repo's write token — never add it here.
name: publish-catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and diff only; do not write or push"
        type: boolean
        default: false
      openclaw_ref:
        description: "openclaw/openclaw ref to generate from"
        type: string
        default: "main"

# No pull-requests scope: this workflow never opens a PR. The organization
# forbids GitHub Actions from creating pull requests, and the old review path
# called `gh pr create` after pushing a branch — so a large upstream change
# failed the run every six hours and left an orphan branch behind. Publishing
# is unattended by design; correctness is enforced by the validation in
# scripts/publish-catalog.mjs (schema, required providers, merge conflicts,
# clock skew and monotonic upstream/publication timestamps), which fails instead of publishing a bad
# document.
#
# OpenClaw's generator and its npm dependencies are third-party code, so they run
# in a separate read-only job; only the artifact (a JSON file) crosses into the
# job that holds the write token, and our publisher validates it there.
permissions:
  contents: read

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout OpenClaw generator
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.openclaw_ref || 'main' }}
          path: openclaw
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OpenClaw dependencies
        working-directory: openclaw
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate OpenClaw catalog
        run: scripts/generate-openclaw-catalog.sh openclaw "$RUNNER_TEMP/sources/openclaw-catalog.json"

      - name: Fetch OpenRouter model list
        run: node scripts/fetch-openrouter.mjs --out "$RUNNER_TEMP/sources/openrouter-models.json"

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-sources
          path: |
            ${{ runner.temp }}/sources/openclaw-catalog.json
            ${{ runner.temp }}/sources/openrouter-models.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci

      - name: Test publishing and supplemental data
        run: npm test

      - uses: actions/download-artifact@v4
        with:
          name: catalog-sources
          path: ${{ runner.temp }}/sources

      - name: Merge OpenRouter and local supplements, then validate the catalog
        id: publish
        run: |
          args=(--source-file "$RUNNER_TEMP/sources/openclaw-catalog.json"
                --openrouter-file "$RUNNER_TEMP/sources/openrouter-models.json")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-catalog.mjs "${args[@]}" --dry-run
          else
            node scripts/publish-catalog.mjs "${args[@]}"
          fi

      - name: Commit and push
        if: >-
          steps.publish.outputs.changed == 'true' &&
          inputs.dry_run != true
        env:
          # env indirection: never interpolate step outputs (which carry
          # upstream-derived strings) directly into a run script.
          SUMMARY: ${{ steps.publish.outputs.summary }}
        run: |
          git config user.name "clawpod-catalog-bot"
          git config user.email "captain@wondermove.net"
          git add models/v1/catalog.json
          git commit -m "catalog: $SUMMARY"
          git push origin HEAD:main
