# Mirror the upstream OpenClaw model catalog.
#
# Triggers are limited to schedule + workflow_dispatch on purpose:
# pull_request_target is the one trigger that would hand a fork PR this
# repo's write token — never add it here.
name: publish-catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and diff only; do not write or push"
        type: boolean
        default: false
      force_pr:
        description: "Open a PR even when the diff is small"
        type: boolean
        default: false

permissions:
  contents: write
  # No pull-requests scope: this workflow never creates a PR. Repository
  # policy ("Allow GitHub Actions to create and approve pull requests") is off
  # here, so a gh pr create call fails the whole run — and it used to, every
  # six hours, after already pushing the review branch. The review path now
  # publishes a branch plus a tracking issue and leaves opening the PR to a
  # person.
  issues: write

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: npm ci

      - name: Fetch, validate, and transform the upstream catalog
        id: publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-catalog.mjs --dry-run
          else
            node scripts/publish-catalog.mjs
          fi

      - name: Commit and push (auto mode)
        if: >-
          steps.publish.outputs.changed == 'true' &&
          inputs.dry_run != true &&
          steps.publish.outputs.needs_review != 'true' &&
          inputs.force_pr != true
        env:
          # env indirection: never interpolate step outputs (which carry
          # upstream-derived strings) directly into a run script.
          SUMMARY: ${{ steps.publish.outputs.summary }}
        run: |
          git config user.name "clawpod-catalog-bot"
          git config user.email "captain@wondermove.net"
          git add models/v1/catalog.json
          git commit -m "catalog: $SUMMARY"
          git push origin HEAD:main

      - name: Stage the review branch (large diff or forced)
        if: >-
          steps.publish.outputs.changed == 'true' &&
          inputs.dry_run != true &&
          (steps.publish.outputs.needs_review == 'true' || inputs.force_pr == true)
        env:
          # env indirection: never interpolate step outputs (which carry
          # upstream-derived strings) directly into a run script.
          SUMMARY: ${{ steps.publish.outputs.summary }}
          REPO: ${{ github.repository }}
          BRANCH: catalog-update
        run: |
          git config user.name "clawpod-catalog-bot"
          git config user.email "captain@wondermove.net"
          git add models/v1/catalog.json
          git commit -m "catalog: $SUMMARY"
          # One fixed branch, force-pushed: a review that stays open for days
          # must not leave a new timestamped branch behind on every run.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          compare="https://github.com/$REPO/compare/main...$BRANCH?expand=1"
          {
            printf '%s\n\n' "$SUMMARY"
            printf 'Review gate triggered: provider removal or model-count swing beyond threshold (or forced). Compare the diff before merging.\n\n'
            printf 'Open the pull request: %s\n' "$compare"
          } > /tmp/review-body.txt
          {
            echo "### Catalog update awaiting review"
            echo
            echo '```'
            cat /tmp/review-body.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Track the pending review in one issue
        if: >-
          steps.publish.outputs.changed == 'true' &&
          inputs.dry_run != true &&
          (steps.publish.outputs.needs_review == 'true' || inputs.force_pr == true)
        # Notification only: the branch and the job summary above already carry
        # the result, so a repository that also restricts issues must not turn
        # a pending review back into a failed run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "catalog: update awaiting review"
        run: |
          # Reuse the same issue for as long as the review is pending and keep
          # its body current, so a review that spans days produces one issue
          # instead of a comment every six hours. `env.TITLE` keeps the title
          # out of the jq program text, and `// empty` makes "no match" an
          # empty string instead of the literal "null".
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/review-body.txt
            echo "updated issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file /tmp/review-body.txt
          fi
