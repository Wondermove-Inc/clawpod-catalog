# Mirror the upstream OpenClaw model catalog.
#
# Triggers are limited to schedule + workflow_dispatch on purpose:
# pull_request_target is the one trigger that would hand a fork PR this
# repo's write token — never add it here.
name: publish-catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and diff only; do not write or push"
        type: boolean
        default: false

# No pull-requests scope: this workflow never opens a PR. The organization
# forbids GitHub Actions from creating pull requests, and the old review path
# called `gh pr create` after pushing a branch — so a large upstream change
# failed the run every six hours and left an orphan branch behind. Publishing
# is unattended by design; correctness is enforced by the validation in
# scripts/publish-catalog.mjs (schema, required providers, merge conflicts,
# clock skew and monotonic upstream/publication timestamps), which fails instead of publishing a bad
# document.
permissions:
  contents: write

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: npm ci

      - name: Test publishing and supplemental data
        run: npm test

      - name: Fetch, merge local supplements, and validate the catalog
        id: publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-catalog.mjs --dry-run
          else
            node scripts/publish-catalog.mjs
          fi

      - name: Commit and push
        if: >-
          steps.publish.outputs.changed == 'true' &&
          inputs.dry_run != true
        env:
          # env indirection: never interpolate step outputs (which carry
          # upstream-derived strings) directly into a run script.
          SUMMARY: ${{ steps.publish.outputs.summary }}
        run: |
          git config user.name "clawpod-catalog-bot"
          git config user.email "captain@wondermove.net"
          git add models/v1/catalog.json
          git commit -m "catalog: $SUMMARY"
          git push origin HEAD:main
